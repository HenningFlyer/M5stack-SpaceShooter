name: ESP32 firmware build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and pinned libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.4
          arduino-cli lib update-index
          arduino-cli lib install "M5GFX@0.2.17"
          arduino-cli lib install --no-deps "M5Unified@0.2.11"
          arduino-cli lib install "Adafruit ILI9341@1.6.2"
          arduino-cli lib list
          arduino-cli board details --fqbn esp32:esp32:m5stack_fire
      - name: Compile SpaceShooter (PSRAM disabled)
        run: |
          mkdir -p build
          arduino-cli compile --fqbn 'esp32:esp32:m5stack_fire:CPUFreq=240,FlashFreq=40,FlashMode=dio,FlashSize=16M,PartitionScheme=default,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1' --warnings all --output-dir build SpaceShooter
          test -s build/SpaceShooter.ino.bin
          test -s build/SpaceShooter.ino.elf
      - name: Upload BIN, ELF and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: SpaceShooter-M5Stack-Fire
          path: |
            build/*.bin
            build/*.elf
            build/*.map
          if-no-files-found: error
          retention-days: 30
      - name: Compile separate 4MB simulation firmware
        if: github.event_name != 'pull_request'
        run: |
          arduino-cli compile --fqbn 'esp32:esp32:esp32:CPUFreq=240,FlashFreq=40,FlashMode=dio,FlashSize=4M,PartitionScheme=default,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1' --warnings all --output-dir sim-build SpaceShooter
          test -s sim-build/SpaceShooter.ino.merged.bin
          test -s sim-build/SpaceShooter.ino.elf
      - name: Upload interactive Wokwi project
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SpaceShooter-Wokwi-interactive
          path: |
            diagram.json
            wokwi.toml
            sim-build/SpaceShooter.ino.merged.bin
            sim-build/SpaceShooter.ino.elf
            SpaceShooter/SpaceShooter.ino
            spaceshooter.test.yaml
            libraries.txt
          if-no-files-found: error
      - name: Wokwi boot smoke test (generic ESP32)
        if: github.event_name != 'pull_request'
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_TOKEN }}
          path: .
          timeout: 30000
          expect_text: "DEBUG 4: vor m5.update"
      - name: Wokwi display and button functional test
        if: github.event_name != 'pull_request'
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_TOKEN }}
          path: .
          timeout: 60000
          scenario: spaceshooter.test.yaml
      - name: Validate captured display frames
        if: github.event_name != 'pull_request'
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image, ImageChops
          frames = []
          for name in ("start-screen.png", "gameplay.png"):
              with Image.open(name) as image:
                  frame = image.convert("RGB")
                  assert sorted(frame.size) == [240, 320], (name, frame.size)
                  assert len(frame.getcolors(320 * 240)) > 1, f"{name}: uniform display"
                  frames.append(frame)
          assert ImageChops.difference(*frames).getbbox(), "Display did not change"
          print("Display frames are non-uniform and differ")
          PY
      - name: Upload Wokwi display screenshots
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SpaceShooter-Wokwi-display
          path: |
            start-screen.png
            gameplay.png
          if-no-files-found: warn
